[project]
name = "deepagent-self"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sachin", email = "sachin.jha07@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.4",
    "ipykernel>=7.3.0",
    "langchain>=1.3.14",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.1",
